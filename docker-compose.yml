
services:
  # 1) PUERTA DE ENLACE Y REVERSE PROXY (Nginx)
  nginx-proxy:
    image: nginx:alpine
    container_name: cartaviva-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - frontend-app
      - api-backend
    networks:
      - red-cartaviva

  # 2) FRONTEND UNIFICADO (Landing + Cliente QR + Cocina KDS + Caja + Admin + SuperAdmin)
  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cartaviva-frontend
    restart: unless-stopped
    networks:
      - red-cartaviva

  # 3) BACKEND API REST + MOTOR WEBSOCKETS (Node.js + Express + Socket.io + Prisma)
  api-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cartaviva-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      DATABASE_URL: postgresql://${DB_USER:-cartaviva}:${DB_PASSWORD:-cartaviva_secret}@postgres-db:5432/${DB_NAME:-cartaviva_db}?schema=public
      REDIS_URL: redis://redis-cache:6379
      JWT_SECRET: ${JWT_SECRET:-cambiar_este_secreto_en_produccion}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - red-cartaviva

  # 4) BASE DE DATOS PRINCIPAL (PostgreSQL 16 — Datos, Planos 2D y Facturación)
  postgres-db:
    image: postgres:16-alpine
    container_name: cartaviva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cartaviva}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cartaviva_secret}
      POSTGRES_DB: ${DB_NAME:-cartaviva_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cartaviva} -d ${DB_NAME:-cartaviva_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red-cartaviva

  # 5) CACHÉ EN MEMORIA Y SESIONES EN VIVO (Redis 7 — Respuestas en < 20ms)
  redis-cache:
    image: redis:7-alpine
    container_name: cartaviva-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - red-cartaviva

  # 6) MONITORIZACIÓN DE ESTADO Y ALERTAS EN TIEMPO REAL (Uptime Kuma)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: cartaviva-monitor-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - red-cartaviva

  # 7) VISOR DE LOGS Y DIAGNÓSTICO DE ERRORES EN VIVO (Dozzle)
  dozzle-logs:
    image: amir20/dozzle:latest
    container_name: cartaviva-monitor-logs
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - red-cartaviva

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  kuma_data:

networks:
  red-cartaviva:
    driver: bridge
