<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" fill="none">
  <defs>
    <!-- Degradados del brote y hojas -->
    <linearGradient id="leafGradMain" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="leafGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <!-- Sombra suave proyectada en el suelo -->
    <ellipse id="floorShadow" cx="95" cy="172" rx="55" ry="14" fill="#0D2622" opacity="0.12"/>
  </defs>

  <!-- ISOTIPO: MESA ISOMÉTRICA CON BROTE VIVA -->
  <g transform="translate(10, 0)">
    <!-- Sombra en el suelo -->
    <use href="#floorShadow"/>

    <!-- Pata trasera (sombreada) -->
    <rect x="94" y="108" width="6" height="30" rx="3" fill="#64748B"/>

    <!-- Pata izquierda -->
    <path d="M 44 126 L 44 162 C 44 164 47 166 49 166 C 51 166 54 164 54 162 L 54 132 Z" 
          fill="#334155" stroke="#0D2622" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Pata derecha -->
    <path d="M 148 126 L 148 162 C 148 164 145 166 143 166 C 141 166 138 164 138 162 L 138 132 Z" 
          fill="#334155" stroke="#0D2622" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Pata delantera central -->
    <path d="M 93 150 L 93 180 C 93 182 96 184 98 184 C 100 184 103 182 103 180 L 103 150 Z" 
          fill="#0D2622" stroke="#0D2622" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Grosor / Canto frontal de la mesa (Lado Izquierdo) -->
    <path d="M 40 116 L 96 148 L 96 156 L 40 124 Z" 
          fill="#94A3B8" stroke="#0D2622" stroke-width="3" stroke-linejoin="round"/>
    <!-- Grosor / Canto frontal de la mesa (Lado Derecho) -->
    <path d="M 96 148 L 152 116 L 152 124 L 96 156 Z" 
          fill="#64748B" stroke="#0D2622" stroke-width="3" stroke-linejoin="round"/>

    <!-- Tablero superior de la mesa (Isométrico con esquinas redondeadas) -->
    <path d="M 96 84 C 98 83 100 83 102 84 L 152 113 C 154 114 154 117 152 118 L 100 148 C 98 149 94 149 92 148 L 40 118 C 38 117 38 114 40 113 Z" 
          fill="url(#tableTop)" stroke="#0D2622" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Marcadores QR estilizados en las 3 esquinas visibles -->
    <!-- Esquina Izquierda -->
    <g transform="translate(48, 114) scale(0.7)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="none" stroke="#0D2622" stroke-width="2.5"/>
      <rect x="4" y="4" width="6" height="6" fill="#0D2622"/>
    </g>
    <!-- Esquina Frontal -->
    <g transform="translate(90, 134) scale(0.7)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="none" stroke="#0D2622" stroke-width="2.5"/>
      <rect x="4" y="4" width="6" height="6" fill="#0D2622"/>
    </g>
    <!-- Esquina Derecha -->
    <g transform="translate(130, 114) scale(0.7)">
      <rect x="0" y="0" width="14" height="14" rx="2" fill="none" stroke="#0D2622" stroke-width="2.5"/>
      <rect x="4" y="4" width="6" height="6" fill="#0D2622"/>
    </g>

    <!-- Orificio central de conexión (Puerto vivo) -->
    <ellipse cx="96" cy="116" rx="16" ry="8.5" fill="#0D2622"/>
    <ellipse cx="96" cy="116" rx="13" ry="6.5" fill="#064E3B"/>

    <!-- BROTE VIVA (Tallo y hojas en V con trazo nítido) -->
    <!-- Tallo izquierdo hacia hoja pequeña -->
    <path d="M 96 114 C 93 92 82 72 65 52" 
          stroke="#0D2622" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 96 114 C 93 92 82 72 65 52" 
          stroke="url(#leafGradLeft)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Hoja izquierda (inclinada) -->
    <path d="M 64 53 C 44 42 36 20 66 18 C 82 32 80 54 64 53 Z" 
          fill="url(#leafGradLeft)" stroke="#0D2622" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 64 53 C 62 38 60 26 62 20" 
          stroke="#34D399" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Tallo derecho principal hacia hoja grande -->
    <path d="M 96 114 C 98 84 114 60 134 32" 
          stroke="#0D2622" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M 96 114 C 98 84 114 60 134 32" 
          stroke="url(#leafGradMain)" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Hoja derecha grande (Viva) -->
    <path d="M 134 32 C 154 16 160 -4 126 2 C 108 18 116 42 134 32 Z" 
          fill="url(#leafGradMain)" stroke="#0D2622" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 134 32 C 128 20 126 10 128 4" 
          stroke="#A7F3D0" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- WORDMARK: CARTAVIVA -->
  <g transform="translate(195, 0)">
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Poppins', 'Montserrat', sans-serif" 
          font-size="70" font-weight="900" letter-spacing="-1.5" fill="#0D2622">
      CartaViva
    </text>

    <!-- SUBTÍTULO DESCRIPTIVO -->
    <text x="3" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" 
          font-size="14.5" font-weight="800" letter-spacing="3" fill="#0D2622">
      SISTEMA DE PLANOS DE MESAS &amp; PEDIDOS EN TIEMPO REAL
    </text>
  </g>
</svg>
